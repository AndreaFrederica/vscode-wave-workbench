[package]
name = "wave-backend"
default-run = "wave-backend"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
build = "build.rs"

[dependencies]
flate2 = "1"
libloading = "0.8"
num-bigint = "0.4"
num-traits = "0.2"
ruzstd = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
