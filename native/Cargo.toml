[package]
name = "wavebench-reader"
default-run = "wave-backend"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
build = "build.rs"

description = "WaveBench Reader for digital FSDB, VCD, and VCS KDB files"
readme = "README.md"

[[bin]]
name = "wave-backend"
path = "src/main.rs"

[features]
verdi-sdk = []

[dependencies]
flate2 = "1"
fst-reader = "0.17.1"
libloading = "0.8"
mlua = { version = "0.12.2", features = ["luajit", "vendored", "serde"] }
num-bigint = "0.4"
num-traits = "0.2"
ruzstd = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
ondas = { git = "https://github.com/AndreaFrederica/ondas.git", rev = "6e6cc63ba13a3358b12ffd2b90ce6f75116624d9", features = ["shm-lib", "wdb-lib"] }
