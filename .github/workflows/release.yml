name: Platform VSIX
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-22.04, rust: x86_64-unknown-linux-gnu }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, rust: aarch64-unknown-linux-gnu }
          - { platform: darwin-x64, runner: macos-15-intel, rust: x86_64-apple-darwin }
          - { platform: darwin-arm64, runner: macos-15, rust: aarch64-apple-darwin }
          - { platform: win32-x64, runner: windows-2022, rust: x86_64-pc-windows-msvc, vcpkg: x64-windows }
          - { platform: win32-arm64, runner: windows-11-arm, rust: aarch64-pc-windows-msvc, vcpkg: arm64-windows }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: node -e "const v = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + v) throw Error('Tag does not match package.json')"
      - name: Install LZO on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y liblzo2-2
      - name: Install LZO on macOS
        if: runner.os == 'macOS'
        run: brew install lzo
      - name: Install LZO on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WAVE_VCPKG_TRIPLET: ${{ matrix.vcpkg }}
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "lzo:${env:WAVE_VCPKG_TRIPLET}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/$env:WAVE_VCPKG_TRIPLET/bin/*lzo*.dll" | Select-Object -First 1
          if (!$dll) { throw "Missing LZO DLL" }
          "WAVE_WORKBENCH_LZO_LIBRARY=$($dll.FullName)" >> $env:GITHUB_ENV
      - run: cargo test --locked --manifest-path native/Cargo.toml --target ${{ matrix.rust }}
      - run: cargo test --locked --manifest-path native/Cargo.toml --target ${{ matrix.rust }} -- --ignored
      - run: npm ci
      - run: npm run package:native -- --target ${{ matrix.platform }}
      - run: node scripts/smoke-package.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: wave-workbench-${{ matrix.platform }}-*.vsix
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.vsix \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
